version: '3'
services:
  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./cv1:/usr/share/nginx/html/cv1
      - ./cv2:/usr/share/nginx/html/cv2
      - ./cv3:/usr/share/nginx/html/cv3
      - ./nginx.conf:/etc/nginx/nginx.conf

  apache:
    image: httpd:latest
    ports:
      - "7000:80"
    volumes:
      - ./cv1:/usr/local/apache2/htdocs/cv1
      - ./cv2:/usr/local/apache2/htdocs/cv2
      - ./cv3:/usr/local/apache2/htdocs/cv3